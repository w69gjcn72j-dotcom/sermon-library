<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --night: #0e1a2b; --night-soft: #142339; --night-card: #1a2c47;
    --brass: #d4a253; --brass-soft: #b08539; --cream: #f5ead4; --cream-dim: #c9bfa8;
    --sage: #88a899; --rose: #d97a6c;
    --line: rgba(212,162,83,0.18); --line-strong: rgba(212,162,83,0.42);
    --shell: min(760px, 100%);
  }
  html { font-size: 18px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
    background: var(--night); color: var(--cream);
    min-height: 100vh; line-height: 1.65; overflow-x: hidden; position: relative;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(245,234,212,0.45), transparent),
      radial-gradient(1px 1px at 78% 9%, rgba(245,234,212,0.35), transparent),
      radial-gradient(1.5px 1.5px at 42% 32%, rgba(212,162,83,0.5), transparent),
      radial-gradient(1px 1px at 89% 64%, rgba(245,234,212,0.4), transparent),
      radial-gradient(1px 1px at 23% 73%, rgba(245,234,212,0.35), transparent),
      radial-gradient(1.5px 1.5px at 60% 88%, rgba(212,162,83,0.45), transparent),
      radial-gradient(1px 1px at 33% 51%, rgba(245,234,212,0.28), transparent),
      radial-gradient(1px 1px at 95% 36%, rgba(245,234,212,0.35), transparent);
  }
  body::after {
    content: ''; position: fixed; top: -220px; left: 50%; transform: translateX(-50%);
    width: 820px; height: 520px; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(212,162,83,0.13), transparent 65%);
  }
  .shell { position: relative; z-index: 1; width: var(--shell); margin: 0 auto; padding: 0 1.25rem; }

  /* ---- top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(14,26,43,0.86); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-in {
    width: var(--shell); margin: 0 auto; padding: 0.7rem 1.25rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .brandmark { display: flex; align-items: center; gap: 0.55rem; margin-right: auto; min-width: 0; }
  .brandmark svg { width: 26px; height: 26px; flex: none; }
  .brandmark b {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 0.98rem;
    letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  select.week {
    font: inherit; font-size: 0.82rem; color: var(--cream);
    background: var(--night-card); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 0.35rem 0.7rem; max-width: 42vw;
  }
  .btn {
    font: inherit; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.04em;
    color: var(--night); background: var(--brass); border: 0;
    border-radius: 999px; padding: 0.4rem 0.95rem; cursor: pointer; white-space: nowrap;
    transition: background 0.18s, transform 0.18s;
  }
  .btn:hover { background: #e5b76b; }
  .btn:active { transform: scale(0.96); }
  .btn.ghost { background: transparent; color: var(--brass); border: 1px solid var(--line-strong); }
  .btn.ghost:hover { background: rgba(212,162,83,0.1); }
  .btn[disabled] { opacity: 0.3; pointer-events: none; }
  a.xlink {
    display: inline-flex; align-items: center; gap: 0.35rem; flex: none;
    text-decoration: none; color: var(--brass); font-size: 0.8rem; letter-spacing: 0.04em;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 0.4rem 0.8rem; transition: background 0.18s;
  }
  a.xlink:hover { background: rgba(212,162,83,0.12); }
  a.xlink span { display: none; }
  @media (min-width: 560px) { a.xlink span { display: inline; } }

  /* ---- hero ---- */
  header.hero { padding: 2.6rem 0 1.8rem; text-align: center; }
  .eyebrow {
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 1rem;
    display: flex; align-items: center; justify-content: center; gap: 0.8rem;
  }
  .eyebrow::before, .eyebrow::after { content: ''; height: 1px; width: 32px; background: var(--brass-soft); opacity: 0.6; }
  header.hero h1 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: clamp(2rem, 7vw, 3rem); line-height: 1.12; letter-spacing: -0.01em;
  }
  .hero-sub { margin-top: 0.55rem; color: var(--brass); font-size: 1.02rem; letter-spacing: 0.02em; }
  .hero-dates { margin-top: 0.2rem; color: var(--cream-dim); font-size: 0.88rem; }
  .bigidea {
    margin: 1.6rem auto 0; max-width: 620px; text-align: left;
    background: var(--night-soft); border: 1px solid var(--line);
    border-radius: 14px; padding: 1.05rem 1.2rem;
    font-family: 'Fraunces', Georgia, serif; font-size: 1.02rem; line-height: 1.55;
  }
  .bigidea b { color: var(--brass); font-weight: 600; }
  details.howto { margin: 0.85rem auto 0; max-width: 620px; text-align: left; }
  details.howto summary {
    cursor: pointer; list-style: none; color: var(--brass);
    font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase;
  }
  details.howto summary::-webkit-details-marker { display: none; }
  details.howto summary::after { content: ' ▾'; }
  details.howto[open] summary::after { content: ' ▴'; }
  details.howto p { margin-top: 0.6rem; color: var(--cream-dim); font-size: 0.94rem; }

  /* ---- day rail ---- */
  .rail-wrap {
    position: sticky; top: calc(env(safe-area-inset-top) + 3.05rem); z-index: 15;
    background: rgba(14,26,43,0.9); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line); margin-top: 1.4rem;
  }
  .rail {
    width: var(--shell); margin: 0 auto; padding: 0.6rem 1.25rem;
    display: flex; gap: 0.45rem; overflow-x: auto; scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail button {
    font: inherit; font-size: 0.8rem; flex: none; cursor: pointer;
    background: var(--night-card); color: var(--cream-dim);
    border: 1px solid transparent; border-radius: 999px;
    padding: 0.42rem 0.9rem; transition: 0.18s; position: relative;
  }
  .rail button:hover { color: var(--cream); border-color: var(--line); }
  .rail button[aria-current="true"] {
    background: var(--brass); color: var(--night); font-weight: 600; border-color: var(--brass);
  }
  .rail button.done::after {
    content: '✓'; position: absolute; top: -3px; right: -1px;
    font-size: 0.62rem; width: 14px; height: 14px; line-height: 14px;
    border-radius: 50%; background: var(--sage); color: var(--night); font-weight: 700;
  }
  .rail button.today-dot { box-shadow: inset 0 0 0 1px var(--line-strong); }

  /* ---- day panel ---- */
  main { padding: 2rem 0 3rem; }
  .day { animation: rise 0.35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .day-no { font-size: 0.74rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--brass); }
  .day h2 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: clamp(1.7rem, 5.6vw, 2.3rem); line-height: 1.18; margin-top: 0.35rem;
  }
  .day-date { color: var(--cream-dim); font-size: 0.88rem; margin-top: 0.3rem; }
  .readref {
    display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1.1rem;
    background: rgba(212,162,83,0.1); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 0.42rem 1rem;
    color: var(--brass); font-size: 0.94rem; font-weight: 500;
  }
  .readref svg { width: 15px; height: 15px; flex: none; }
  .prose { margin-top: 1.3rem; }
  .prose p { margin-bottom: 1rem; font-size: 1.04rem; }
  .prose p:last-child { margin-bottom: 0; }

  .block { margin-top: 1.6rem; border-radius: 14px; padding: 1.1rem 1.25rem; }
  .block h3 {
    font-family: 'Inter Tight', sans-serif; font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.24em; text-transform: uppercase; margin-bottom: 0.6rem;
  }
  .pray { background: var(--night-soft); border: 1px solid var(--line); border-left: 3px solid var(--brass); }
  .pray h3 { color: var(--brass); }
  .pray p { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 1.03rem; line-height: 1.6; }
  .three { background: rgba(136,168,153,0.09); border: 1px solid rgba(136,168,153,0.28); border-left: 3px solid var(--sage); }
  .three h3 { color: var(--sage); }
  .three p { color: var(--cream-dim); font-size: 0.97rem; }
  .reflect { background: var(--night-card); border: 1px solid var(--line); }
  .reflect h3 { color: var(--rose); }
  .reflect p { font-size: 1.03rem; }

  .markrow { margin-top: 1.7rem; display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  .navrow { margin-top: 1.2rem; display: flex; gap: 0.6rem; }
  .navrow .btn { flex: 1; text-align: center; padding: 0.6rem 1rem; font-size: 0.9rem; }

  /* ---- whole-week view ---- */
  body.showall .day { display: block !important; }
  body.showall .day + .day { margin-top: 3rem; padding-top: 2.4rem; border-top: 1px solid var(--line); }
  body.showall .navrow { display: none; }
  body.printing .day { display: block !important; }

  .tools { margin-top: 1.8rem; display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
  .tools .btn { font-size: 0.84rem; padding: 0.5rem 1.1rem; }
  .tip {
    margin: 0.75rem auto 0; max-width: 460px; text-align: center;
    color: var(--cream-dim); font-size: 0.8rem; line-height: 1.5; display: none;
  }
  .tip.on { display: block; }

  .prog { margin-top: 2.4rem; text-align: center; color: var(--cream-dim); font-size: 0.82rem; }
  .prog .bar { height: 4px; border-radius: 999px; background: var(--night-card); margin: 0.55rem auto 0; max-width: 260px; overflow: hidden; }
  .prog .bar i { display: block; height: 100%; background: var(--brass); transition: width 0.4s; }

  footer {
    position: relative; z-index: 1; margin-top: 2.5rem; padding: 2rem 1.25rem 2.6rem;
    border-top: 1px solid var(--line); text-align: center;
    color: var(--cream-dim); font-size: 0.86rem; line-height: 1.85;
  }
  footer a { color: var(--brass); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .sdg { display: block; margin-top: 0.9rem; font-family: 'Fraunces', Georgia, serif; font-style: italic; color: var(--brass-soft); }

  @media (max-width: 420px) {
    html { font-size: 17px; }
    .brandmark b { font-size: 0.9rem; }
  }

  /* ---- print: the whole week ---- */
  @media print {
    body { background: #fff; color: #111; }
    body::before, body::after, .topbar, .rail-wrap, .markrow, .navrow, .prog, .tools, .tip, .btn, footer { display: none !important; }
    .shell { width: 100%; padding: 0; }
    .day { display: block !important; page-break-after: always; animation: none; }
    .day h2, header.hero h1 { color: #3a2a10; }
    .block, .bigidea { border: 1px solid #bbb !important; background: #fafafa !important; }
    .day-no, .readref, .pray h3 { color: #7a5a18 !important; }
    .readref { border-color: #bbb; }
    .three h3 { color: #3f5a4c !important; }
    .reflect h3 { color: #8a3f33 !important; }
  }
</style>
</head>

<script>
/* ==========================================================================
   DEVOTION DATA
   --------------------------------------------------------------------------
   To add a new week, copy one WEEKS entry and edit it. Nothing else changes.

     id      unique slug, used in the #hash link and to save progress
     title   the series title (usually the sermon title)
     passage the passage the week works through
     start   Monday of that week, "YYYY-MM-DD" — the app uses it to find today
     idea    the sermon's big idea, one sentence
     how     the "how to use" note
     days[]  one entry per day, in order:
               t     day title
               read  Bible reading reference (reference only)
               body  array of paragraphs
               pray  the written prayer, including that day's Checkpoint
               ask   the reflection question
     three   the standing reminder printed under every prayer that week
   ========================================================================== */

const WEEKS = [
{
  id: "gal2",
  title: "How the Gospel Demolishes the Self and Rebuilds a Life",
  passage: "Galatians 2:15–21",
  start: "2026-08-24",
  idea: "The gospel is not self-improvement but the death of the self: you are justified by faith in Christ alone, and the life you now live is Christ living in you, who loved you and gave himself for you.",
  how: "Each day, find a quiet ten minutes. Read the short Bible passage slowly (CSB if you can), then the reflection, which follows Sunday’s sermon through the passage a few verses at a time. Pray the written prayer in your own words, and sit with the question before you get on with your day. Six days, Monday to Saturday, so that Sunday’s word is still working on you when the next Sunday comes. Each day carries one of our six church Checkpoints in its prayer — by Saturday you will have prayed for them all.",
  three: "And as every day this week: pray for your three friends who aren’t Christians yet — that God’s kindness would lead them to repentance, and that God would give you an opportunity to point one of them to Jesus.",
  days: [
    {
      t: "The Demolition Order",
      read: "Galatians 2:15–16 (CSB)",
      body: [
        "Travel through China today and you will see that the building programme is more or less finished. High-rise towers everywhere. You rarely see a run-down house any more with a demolition order pasted on the outside wall.",
        "But every one of us has a high-rise tower of the self still under construction. Some of us use career achievements as the foundation. Some use moral character as the walls. Some use religious devotion as the roof, and some use other people’s approval as the exterior decoration. We never stop building, decorating, renovating and reinforcing — all to prove to the world around us, and to ourselves, that we are people of worth.",
        "Into that building site Paul serves the most subversive demolition order in human history. Not a renovation. Not reinforcement. The tower comes down, pulled up by the roots.",
        "He begins in verse 15 with a note of irony: “We are Jews by birth and not ‘Gentile sinners.’” In Jewish eyes, Gentiles were sinners by birth — no law, no circumcision, only idols. Jews had the law, the covenant sign, and Abraham as father. Paul says, in effect: very well, granting all of that — we still need to be justified. And if the people with every advantage cannot be saved by their own works, what hope is there in anyone’s effort?",
        "Then verse 16 lands: “a person is not justified by the works of the law but by faith in Jesus Christ.” Justified is a courtroom word. It does not mean God turns you into a good person. It means God declares that your case is closed, the charge against you has been dropped, and your standing has been changed.",
        "The demolition order is not aimed at you. It is aimed at the tower you have been building to justify yourself. And what goes up in its place is not a better self. It is Christ."
      ],
      pray: "Father, I have been building a tower to prove that I am worth something — to others, and to myself. Show me where it stands, and give me the courage to let you pull it down. Thank you that in Christ my case is closed and the charge is dropped. And as we ask you for three mid-week Growth Groups, raise up the leaders, open the homes, and gather the people, so that we learn together to build on Christ alone. Amen.",
      ask: "If you are honest, what is your tower built out of — achievement, morality, religion, or other people’s approval?"
    },
    {
      t: "No Long-Service Benefits",
      read: "Galatians 2:16 (CSB)",
      body: [
        "“The works of the law” does not simply mean doing good deeds. Paul means the whole Mosaic system: circumcision, food laws, Sabbath, sacrifices. The Judaizers were telling the Galatians that you must keep all of it in order to be saved. Paul says none of it can do it — because the purpose of the law is to reveal sin, not to remove it. The law is a mirror. It shows up your filth. It cannot wash it away.",
        "So Paul writes, “even we ourselves have believed in Christ Jesus.” Even we. Even the privileged, the well-taught, the circumcised. There are no exceptions, no shortcuts, and no long-service benefits for old Christians.",
        "A brother served for years in a church back in China — teaching Sunday school, leading a small group, even helping build the building. Underneath it he carried a hidden sense of security: I have done so much; God must surely accept me. Galatians 2:16 shone a light on that. Even doing all the church things, if you make them the foundation of your standing with God, you are being justified by works of the law. That is why the unease never lifts. Not because you have not done enough, but because the whole thing is built on sand.",
        "So he learned to say to himself each morning: I am not justified by my service. I am justified by faith in Christ. I serve out of thanks, not to earn grace or anyone’s approval.",
        "Then Paul quotes Psalm 143:2 to close every remaining door: “by the works of the law no human being will be justified.” Zero exceptions. If you think you are keeping it better than most, that is still not the standard. The standard is flawless. James says it plainly: stumble at one point and you are guilty of it all.",
        "Which is bleak, until you notice it is the same verse that hands you Christ."
      ],
      pray: "Lord Jesus, I have quietly treated my years of church, my service and my record as though they earned me something with you. Forgive me. Let me rest today on your finished work and nothing of my own. Thank you that I am accepted, not on probation. And we ask you for six more qualified helpers for KOGKids, KOGMini and KOGYouth — raise them up from among us, and let them serve out of gratitude and not to prove themselves. Amen.",
      ask: "What do you reach for first when you want to feel that God is pleased with you?"
    },
    {
      t: "What I Refuse to Rebuild",
      read: "Galatians 2:17–18 (CSB)",
      body: [
        "Paul anticipates the accusation. If people do not need the works of the law, are you not just giving them permission to sin? If justification is free, why not live however you like? “Is Christ then a promoter of sin? Absolutely not!”",
        "Then verse 18: “If I rebuild those things that I tore down, I show myself to be a lawbreaker.” What had Paul torn down? The whole system of being justified by law-keeping. And if he now started rebuilding it — if he told the Galatians they still needed to keep the law to be right with God — that would be the sin. Because it denies the grace of Christ.",
        "Notice how the accusation gets turned around. The Judaizers thought Paul was the loose one. Paul says the truly serious offence is going back. If you have believed in Christ and then return to the law for your standing, you are saying: the death of Christ was not quite enough; let me add a little of my own effort. That is not devotion. It is an insult to the cross.",
        "This is where the exclusivity of the gospel bites. Either all of Christ, or all of you. There is no half and half. Add a little of your effort and you have denied all of God’s grace.",
        "It is worth asking what you have already torn down and are quietly rebuilding. A rule you keep so you can feel safe. A private scoreboard for your quiet times. A comparison you run against another Christian so you come out ahead. None of these are neutral. Each one is a brick going back into a building God has already condemned.",
        "Grace does not make sin safe. It makes self-justification unnecessary — and that is a far deeper cure."
      ],
      pray: "Father, I keep picking bricks back up. I want a rule I can keep, a score I can check, a standard I can pass. Forgive me for treating the cross as though it were not quite enough. Teach me to leave the ruins alone. And we pray for our Father’s Day celebration, “A Father’s Invitation” — that many would come, that fathers and friends would hear of your grace, and that no one would leave thinking they must earn you. Amen.",
      ask: "What have you already torn down once that you can feel yourself starting to rebuild?"
    },
    {
      t: "Dead to the Law, Alive to God",
      read: "Galatians 2:19 (CSB)",
      body: [
        "“For through the law I died to the law, so that I might live for God.” The law plays the part of the executioner. It pronounces the sentence: you deserve to die. Paul accepts the verdict — and so he dies to the law. And the law has no jurisdiction over a dead person. As a marriage law no longer binds a widow, so the law’s claim on Paul is finished.",
        "But death is not the point. Living for God is the point. The law put Paul to death so that he could be released from its crushing weight and finally begin to live for the God who made him.",
        "There is a double death here. Christ died in Paul’s place and bore the curse of the law. And Paul died with Christ, so the law’s authority over him ended. The result is that he no longer builds his worth by keeping rules. He is free.",
        "An office worker came to Christ and yet kept living in the same old pattern: working late into the night to earn one line of praise from the boss. His sense of worth rose and fell with a manager’s opinion. Galatians 2:19 showed him that he had died to human approval. God had already accepted him. He did not need his boss’s praise to confirm that he existed. He could go home at a normal hour and be with his children — and that was not laziness, it was freedom. He still worked hard. But the engine underneath it changed: for the Lord, not for the applause.",
        "This is what dying to the law does. Other people’s expectations and other people’s approval no longer have the power to condemn you. God has accepted you in Christ, and that is enough.",
        "Which means you are now free to stop caring about a great many things — and that freedom is exactly what lets you care about what God cares about."
      ],
      pray: "Lord, I have let other people’s approval sit on the throne where you belong, and I have been exhausted by it. Thank you that through the law I died to the law, and that your verdict over me is settled. Free me today to work and rest for you. And we ask you for four new accompanists for our Chinese Parallel congregation — provide them, and let them play for your glory and not for praise. Amen.",
      ask: "Whose approval has been running your week — and what would change if it no longer could condemn you?"
    },
    {
      t: "No Longer I",
      read: "Galatians 2:20a (CSB)",
      body: [
        "“I have been crucified with Christ, and I no longer live, but Christ lives in me.” This is not Paul saying he crucifies his own sin by willpower. It is union: when Christ died, God placed Paul in him. The old self, the self-centred self, the self that tried to be justified by law — all of it was executed there.",
        "The tense matters. “Have been crucified” is a completed action with a permanent result. Your old self is not slowly dying. It has already been put to death at the cross, and that verdict stands.",
        "Be careful what that means. The old self is your old identity in Adam, your old bondage to sin — not the total disappearance of your sinful nature. Christians still live with the leftovers of the old flesh. Paul himself describes two laws at war inside him, and it grieves him. So our work now is to live out a fact already accomplished, and to keep putting sin to death by the Spirit rather than by our own strength.",
        "“I no longer live” does not mean Paul has been erased, or that he has lost his personality. It means the self that ran the show, the self that justified itself, no longer holds sovereignty. The centre has been replaced. New centre: Christ. New power: Christ. New identity: Christ.",
        "Our culture says, discover yourself, be yourself. The gospel says, lose yourself and you will find your true self. The self is the most well-hidden idol we own. You are not wiped out in Christ — for the first time you become a real self, a new creation, no longer distorted by anxiety about your performance or twisted by the need to defend yourself.",
        "So pray it in the morning before the day gets hold of you: Lord, today I have no strength, but you are my strength. Live your life in me."
      ],
      pray: "Lord Jesus, I have been crucified with you. Let that be more real to me than my moods and my failures today. I have no strength of my own — live your life in me by your Spirit, and put my sin to death where I cannot. And we pray for the growth of our church toward seventy-five households by the end of this year: not to make us impressive, but because there are people who need to hear that the old self can die and Christ can live in them. Amen.",
      ask: "Which part of your old self do you still treat as though it were alive and in charge?"
    },
    {
      t: "He Loved Me and Gave Himself for Me",
      read: "Galatians 2:20b–21 (CSB)",
      body: [
        "“The life I now live in the body, I live by faith in the Son of God, who loved me and gave himself for me.” Becoming a Christian does not lift you out of ordinary life. You still have a body, a family, a job, responsibilities. Christianity is not a retreat into a monastery, and you are not turning into a spiritual ghost. You are still living in the body. What has changed is how. Not by your own strength keeping the law, but by faith, drawing on the life of Christ.",
        "And then the engine of the whole verse: “who loved me and gave himself for me.” Personal. Specific. Not an abstract love for humanity in general, but for you — by name.",
        "A brother sank into deep self-loathing. Ordinary career, bad temper, prayers that felt cold, no appetite for God. He kept telling himself he was not fit to be a Christian. Then one Sunday a sermon on this verse spoke straight into it: you have already been crucified with Christ. The whole question of whether you are good enough was nailed there. The one living now is not the you who does everything badly — it is Christ living in you. And why is he living in you? Because he loved you and gave himself for you. Not because you deserved it.",
        "So when the accusations came, he learned to answer them: yes, I am not good enough; and Christ lives in me. That is not cheap grace dodging responsibility. It is being accepted first, which is the only soil real change ever grows in.",
        "Verse 21 seals it. “If righteousness comes through the law, then Christ died for nothing.” If you could get there yourself, God would never have handed over his Son. The cross proves that we could not.",
        "Picture a drowning man grabbing his own hair to pull himself out. That is every religion. The gospel is a pair of nail-scarred hands reaching down from above. You do not need to hold your own hair. You need to let go, and take hold of him."
      ],
      pray: "Lord Jesus, you loved me and gave yourself for me — me, by name. When I accuse myself today, let that be my answer. I let go of my own righteousness and take hold of you; I will not set aside the grace of God. And we pray for our move to the new School hall in 2027: go before us, provide what we need, and keep our eyes on the people you mean to reach there rather than on the building. Amen.",
      ask: "What would change today if you truly believed that Jesus loved you and gave himself for you — personally, by name?"
    }
  ]
},
{
  id: "1cor1",
  title: "The Foolish Wisdom of the Cross of Christ",
  passage: "1 Corinthians 1:18–25",
  start: "2026-08-17",
  idea: "Don’t be a wise-sounding fool but a foolish-sounding sage, for God is pleased to save all who believe his message of Christ crucified.",
  how: "Each day, find a quiet ten minutes. Read the short Bible passage slowly (CSB if you can), then the reflection, which follows Sunday’s sermon through the passage a few verses at a time. Pray the written prayer in your own words, and sit with the question before you get on with your day. Six days, Monday to Saturday, so that Sunday’s word is still working on you when the next Sunday comes. Each day carries one of our six church Checkpoints in its prayer — by Saturday you will have prayed for them all.",
  three: "And as every day this week: pray for your three friends who aren’t Christians yet — that God’s kindness would lead them to repentance, and that God would give you an opportunity to point one of them to Jesus.",
  days: [
    {
      t: "Alone in the Stand",
      read: "1 Corinthians 1:18 (CSB)",
      body: [
        "In 2012 a Brazilian football team from Santa Cruz played Gremio. A young man named Tiago Rech arrived early to support his team. The match kicked off, and nobody else came. Santa Cruz scored, and there was no one to celebrate with him. They lost 4–1, and through the whole game there was exactly one man in the stand on their side. His photograph went around the world.",
        "Why did nobody else turn up? Perhaps they did not really believe in their team. Perhaps they did not want to be seen losing. We do not like being embarrassed; we want to be found with the winners.",
        "We can feel the same way about the Bible’s message. We suspect what the church teaches is outdated. We suspect the church itself looks weak and needs propping up. So we go quiet.",
        "Paul says something far more serious is going on. “For the word of the cross is foolishness to those who are perishing, but it is the power of God to us who are being saved.” One message, two opposite responses. To perish is to be ruined and destroyed — not final yet, but it will be, if the cross of Christ is still a joke to you.",
        "And notice who does not find the message embarrassing. Not the clever, but those who are being saved. That verb is present tense, and it covers your whole life: at the cross Jesus saved you; he keeps saving you through trials and temptations as you keep trusting and following him; and he will come back to save you completely.",
        "So the question this week is not whether the message sounds foolish; to some people it always will. The question is whether you will stand with Christ even when the stand around you is empty."
      ],
      pray: "Father, I have been quieter about Jesus than I want to admit, because I did not want to look foolish. Forgive me. Let me see the power of God in the word of the cross, and make me glad to be counted with those who are being saved. And as we ask you for three mid-week Growth Groups, raise up the leaders, open the homes, and gather the people, so that we learn together to boast in Christ crucified. Amen.",
      ask: "Where have you gone quiet about Jesus lately — and what were you actually afraid of?"
    },
    {
      t: "The Wisdom God Will Destroy",
      read: "1 Corinthians 1:19–20 (CSB)",
      body: [
        "“For it is written, I will destroy the wisdom of the wise, and I will set aside the intelligence of the intelligent” (v.19). That sounds harsh until you see where Paul found it. He is quoting Isaiah 29:14, and the verse just before explains everything: “These people approach me with their speeches to honour me with lip-service, yet their hearts are far from me, and human rules direct their worship of me.”",
        "God is not against thinking. He is not destroying all wisdom, or scholarship, or careful argument. He is destroying one particular kind of wisdom: the wisdom that reckons it knows better than God, that keeps the words of worship while the heart is far away, that runs on human rules and calls it religion, that imagines God can be managed or even fooled.",
        "Then verse 20 fires three questions in a row: “Where is the one who is wise? Where is the teacher of the law? Where is the debater of this age? Hasn’t God made the world’s wisdom foolish?” Where are the experts who can stand up and successfully argue against God? Nowhere. They sound impressive in their own ears. Before God, what they say and what they trust is rubbish.",
        "This is worth naming honestly, because that kind of wisdom is not only out there in the world. It sits in our own hearts every time we quietly decide that some part of God’s word is behind the times, and that we have grown past it.",
        "Ask yourself where you are doing that. And then remember that the God who sets aside the intelligence of the intelligent is the very same God who has been pleased to make you wise in Christ. That is mercy, not humiliation."
      ],
      pray: "Father, you set aside the intelligence of the intelligent, and I have too often reasoned my way around your word instead of sitting under it. Search me, and make me wise with the wisdom that simply trusts you. Please give us six additional qualified helpers for KOGKids, KOGYouth and KOGMini — people who will hand your unchanging word to our children and young people without embarrassment. Amen.",
      ask: "Which part of God’s word have you quietly decided you have grown past? What would it take to sit under it again this week?"
    },
    {
      t: "God’s Foolish-Looking Method",
      read: "1 Corinthians 1:21 (CSB)",
      body: [
        "“For since, in God’s wisdom, the world did not know God through wisdom, God was pleased to save those who believe through the foolishness of what is preached.”",
        "Read that slowly. God is pleased — delighted to save perishing people through a message the world calls stupid.",
        "And notice how he delivers it — through preaching. You can sing the message of the cross, paint it, even act it out. But the one delivery God names here, the one the church has used for two thousand years, is the preaching of Christ crucified.",
        "Preaching has never sounded exciting. It did not sound exciting in New Testament days either. Back then people were far more interested in debate, argument and persuasion. To preach is simply to proclaim a message; it is the work of a herald, not a performer. Yet God has made preaching his modus operandi. He does not want his people known as eloquent debaters but as faithful preachers of the gospel. There is a place for eloquence, but preaching is at the heart of what our church must do, because it is what God has chosen.",
        "Lesslie Newbigin went to India as a missionary in the 1930s. When he came home to England in the 1980s he found England every bit as much a mission field, and judged Western culture “the most powerful and pervasive of human cultures” and, next to Islam, “the most resistant to the gospel.” We live in that culture, in a multicultural city, as a church of many cultures. We should expect to be rejected.",
        "If you are treated as a fool for disobeying God, that is fair enough. But if you are treated as a fool for preaching the cross, take heart. You are only running your Master’s errands."
      ],
      pray: "Father, thank you that you are pleased to save people who believe through the foolishness of what is preached. Keep our church faithful to that message whatever it costs us in reputation, and give me an appetite for your word preached. Bless our Father’s Day celebration, “A Father’s Invitation” — give us courage to invite, give our guests ears to hear, and be pleased to save many on that day. Amen.",
      ask: "How do you listen to preaching on a Sunday — as a performance to be judged, or as God’s chosen way of saving people?"
    },
    {
      t: "Don’t Soften the Scandal",
      read: "1 Corinthians 1:22–23 (CSB)",
      body: [
        "“For the Jews ask for signs and the Greeks seek wisdom, but we preach Christ crucified, a stumbling block to the Jews and foolishness to the Gentiles.”",
        "The word behind “stumbling block” is the Greek σκάνδαλον — where we get our word scandal. In The Two Towers there is a famous scene where Viggo Mortensen kicks a heavy Uruk-hai helmet in grief and frustration — so hard that he broke two toes. The director kept the take, and the scream you hear is real. That is roughly what the cross of Christ felt like to a Jewish hearer: not a mild disagreement, but a stumbling block that made them angry.",
        "They had watched God’s power for centuries — the rescue from Egypt, prophets sent with acts of power. So they wanted a sign as proof that God had sent Jesus. Jesus answered that no sign would be given except the sign of the prophet Jonah: three days and three nights, that is, his death and resurrection (Matthew 12:38–40). A crucified Messiah was unthinkable. God would not let his Chosen One die, least of all on a humiliating Roman cross.",
        "To Greek ears it was simply foolish. They had thought deeply and philosophically for centuries and wanted clear, persuasive arguments they could judge for themselves. When Paul reached the resurrection at the Areopagus they ridiculed him. Why would anyone want a physical body back?",
        "We still hear both. “If God does this for me when I pray, then I will believe in him.” Or, “I don’t understand it, so it must be wrong.” Does God have to prove himself to you? He can, but he need not. He has already shown his power in the cross of Christ.",
        "So do not give the world what it demands. Give it the crucified Christ."
      ],
      pray: "Father, forgive me for the times I have softened the scandal of the cross to make myself easier to like. Give me plain words and a steady heart with my neighbours and my friends. And please provide four new accompanists for our Chinese Parallel congregation — raise them up, give them willing hearts and skilful hands, so that your people can sing of Christ crucified. Amen.",
      ask: "What sign or what argument have you been quietly demanding from God before you will fully trust him?"
    },
    {
      t: "Two People Standing in the Rain",
      read: "1 Corinthians 1:24 (CSB)",
      body: [
        "“Yet to those who are called, both Jews and Greeks, Christ is the power of God and the wisdom of God.”",
        "Those who are called do not receive a different message from the one the world mocks. We receive the same message and come to the opposite conclusion. Where the world sees weakness, we see the power of God; where it sees foolishness, we see the wisdom of God.",
        "Picture two people standing in the same downpour. One is a teenager, upset because their brand-new Adidas Superstars are being ruined. The other is their father, looking up to heaven with a sigh of relief like a farmer at the end of a drought, thanking God that he has finally answered the prayer for rain. The rain has not changed. What has changed is what they count as treasure.",
        "In the same way, how you respond to the cross of Christ shows what you treasure in your heart. Left to ourselves we are all the teenager: we want God to meet our demands, and when he does not, or when he embarrasses us, we fret and get frustrated and behave poorly. For our hearts to prize God’s rain of blessing like the farmer, our hearts have to be changed — and they are only changed when God calls us.",
        "To be called by God here is to be chosen by God for salvation. Those who are called are better off, but not because we are better. It is all mercy and grace.",
        "And notice who is called: both Jews and Greeks — the very groups who rejected the cross as foolishness. A sage is simply an old word for a wise one. God takes people who thought themselves wise but were actually fools, and by his gracious call makes them truly wise."
      ],
      pray: "Father, I would still be treasuring the wrong things if you had not called me. Thank you for your mercy. Keep changing my heart until Christ crucified is plainly the power of God and the wisdom of God to me. We ask you for the growth of our church to seventy-five households by the end of this year — not for our name, but so that more people are called and made truly wise in Jesus. Amen.",
      ask: "What does your reaction to the cross of Christ reveal about what you are actually treasuring right now?"
    },
    {
      t: "Wiser and Stronger Still",
      read: "1 Corinthians 1:25 (CSB)",
      body: [
        "“because God’s foolishness is wiser than human wisdom, and God’s weakness is stronger than human strength.”",
        "When we are at our strongest — military, political, financial — God is stronger still. When we are at our wisest — intellect, scholarship, ingenuity — God is wiser still. Do not let what seems foolish and weak fool you; it is by these very things that God destroys the wisdom of the wise and makes the strongest stumble.",
        "Elizabeth Foord, a dear friend of Jenny’s, died recently. She was tiny — the shortest person in our family. But she was mighty, serving God and teaching the Bible to many people here and around the world. At one stage she taught eight Scripture classes a week, visited people in twelve nursing homes, ran a school lunchtime Bible study, taught Sunday school, helped in youth group and sang in a choir. When Jenny met her, she prayed for us both as we prepared for ministry at St Paul’s Kogarah. She was one of the wisest and strongest women we have ever met — and she is wiser and stronger now, because she is with our Lord Jesus.",
        "Serving here is not for the faint-hearted. It is hard work and it takes genuine trust in God. Without it we grow weary, discouraged by how weak and foolish we look, and finally embarrassed by God’s work among us.",
        "So please, do not be a wise-sounding fool. Be a foolish-sounding sage. Boast in the crucified Christ and no one else, and do not soften the scandal of the cross. Tell the message plainly to your neighbour and your friend. And do not avoid the friend who thinks they are too clever, too religious, too good for the gospel — those are exactly the people who need to hear it."
      ],
      pray: "Father, your foolishness is wiser than our wisdom and your weakness is stronger than our strength. When the work here is hard and we look weak, keep us from being ashamed of you, and let us boast in Christ crucified alone. Go ahead of us as we look towards our move to the new School hall in 2027 — prepare the place, prepare us, and gather in the people you have already called. Amen.",
      ask: "Who is the friend you have been avoiding because they seem too clever or too good for the gospel — and what will you say to them this week?"
    }
  ]
},
{
  id: "romans4",
  title: "Hope Against Hope",
  passage: "Romans 4:1–25",
  start: "2026-08-10",
  idea: "Be fully and joyfully convinced, hoping against hope, in the God who credits righteousness to those who trust in him who raised Jesus our Lord from the dead.",
  how: "Each day, find a quiet ten minutes. Read the short Bible passage slowly (CSB if you can), then the reflection, which follows Sunday's sermon through the passage a few verses at a time. Pray the written prayer in your own words, and sit with the question before you get on with your day. Six days, Monday to Saturday, so that Sunday's word is still working on you when the next Sunday comes. Each day carries one of our six church Checkpoints in its prayer — by Saturday you will have prayed for them all.",
  three: "And as every day this week: pray for your three friends who aren't Christians yet — that God's kindness would lead them to repentance, and that God would give you an opportunity to point one of them to Jesus.",
  days: [
    {
      t: "Who Gets the Credit?",
      read: "Romans 4:1–5 (CSB)",
      body: [
        "Once upon a time, television shows rolled their credits before the show began — actors, director, producers, hair stylists, assistants — because a lot of people had worked hard to make it happen. Then the credits moved to the end. Then they were sped up. Now, before they even start, you have already pressed the link to the next video. Who really cares about the credits?",
        "In Romans 4 someone gets credited — and more impressive than the person credited is the Person doing the crediting. It is God himself. And the man he credits is Abraham.",
        "Paul asks what Abraham “found”. It is a lovely word: Abraham discovered something. He discovered he had nothing to boast about before God. Not before people either. For most of his life before he was seventy-five he was an idol worshipper, and he lied more than once to save his own skin — even when it put his wife at risk. Some Jewish teachers held him up as the man who kept the law before the law was given. Abraham himself knew better.",
        "Instead, “Abraham believed God, and it was credited to him for righteousness” (v.3). Verse 4 draws the line: wages are owed, gifts are given. Nobody writes a thank-you card to their employer for their salary. And no guest at your birthday hands you an invoice for your present — if they did, they were never really your friend. Wages are not gifts, and gifts are not wages.",
        "So stop asking, “What have I achieved for God?” and start asking, “What has God credited to me in Christ?”"
      ],
      pray: "Father, I have been quietly keeping a record of my own good work and hoping it counts for something with you. Forgive me. Teach me to receive your righteousness as the gift it is, given in Jesus and never earned. And as we seek to grow three mid-week Growth Groups, raise up the leaders, open the homes, and gather the people, so that more of us learn to live by faith together. Amen.",
      ask: "Where are you still trying to hand God an invoice — treating some part of your obedience as though he owes you for it?"
    },
    {
      t: "The Drive Is Gone",
      read: "Romans 4:6–8 (CSB)",
      body: [
        "Paul brings a second witness, and it is not a man you would choose as a character reference. It is King David — adulterer, liar, and the arranger of a good man's death. David sings, “Blessed are those whose lawless acts are forgiven and whose sins are covered. Blessed is the person the Lord will never charge with sin” (vv.7–8, quoting Psalm 32).",
        "To be blessed is to be happy — happy because God is happy with you. Your sins are covered. God will not revisit them.",
        "Imagine a USB drive holding the evidence of the thing you are most ashamed of. An outright lie. A plan to bring somebody down. As long as that drive exists you are never quite at ease; there is proof of your guilt sitting in somebody's drawer. Now imagine the Supreme Judge walks over, takes the drive, and tells you that you never need to think about it again. Someone else has been sentenced for what you did. You are free to go. The drive is gone, forever.",
        "You can doubt the Judge and refuse the news. Or you can trust what he has said and finally breathe.",
        "That is not the Judge being soft. God says in Exodus 23:7 that he will not justify the guilty, and he does not — he justifies the guilty by putting forward Jesus as the atoning sacrifice for our sin (3:25). The cost was paid; it simply was not paid by you.",
        "As Origen put it long ago, “faith relies on the grace of the justifier, works rely on the justice of the rewarder.” Which are you relying on today? Let the relief of being forgiven turn into the joy David is singing about."
      ],
      pray: "Father, thank you that in Christ my sin is covered and you will never charge me with it again. Turn my relief into song. Make me a person who tells others what you have done rather than what I have done. And please give us six additional qualified helpers for KOGKids, KOGMini and KOGYouth — people who know they are forgiven, and who will teach our children and young people to know it too. Amen.",
      ask: "What is the sin you keep re-opening even though God has closed the file? What would it look like to thank him for it instead?"
    },
    {
      t: "Father of All Who Believe",
      read: "Romans 4:9–12 (CSB)",
      body: [
        "Paul now asks a question about timing, and the answer is worth more than it first looks. Was Abraham credited with righteousness before or after he was circumcised? Before — by many years. Circumcision came afterwards, as a seal on a righteousness he already had by faith. He was not circumcised in order to be righteous; he trusted God, was counted righteous, and then was circumcised.",
        "Which makes Abraham the father of two kinds of people who are really one kind: those who are not Jewish but trust the Lord Jesus, and those who are Jewish and also walk in the footsteps of their father's faith. Abraham is father to everyone who trusts God — not by blood, but by faith.",
        "That has a very practical shape at Kogarah. If God credits righteousness to the ungodly who trust him, then our invitation to the five hundred households within ten minutes of our building can never be limited to people who have sorted their lives out. We welcome the messy, the imperfect, the ones who do not look or sound like us — because God welcomed us. If God has taken us into his family, we dare not turn anyone away or let anyone feel unwelcome.",
        "That is exactly what the Welcome to Life ministry is for, and why we have set up the Discover course and the Welcome Tent. Come as the ungodly, and be counted righteous in Christ.",
        "It also means we will never congratulate ourselves on our attendance or how smoothly we run. We believe in the God who declares the ungodly righteous, and we simply long to see him declare more of them righteous in Jesus."
      ],
      pray: "Father, you welcomed me before I had anything to show you. Make our church a place where nobody is turned away and nobody is left feeling unwelcome. Bless our Father's Day celebration, “A Father's Invitation” — give us courage to invite, give our guests ears to hear, and make many of them children of Abraham by faith in Jesus. Amen.",
      ask: "Who would feel out of place if they walked into our church this Sunday — and what will you personally do about it?"
    },
    {
      t: "Steps of Conviction",
      read: "Romans 4:13–17a (CSB)",
      body: [
        "Lleyton Hewitt was the last Australian man to hold the world number one ranking in tennis, almost twenty-five years ago now, and his trademark was that hand to the head and a shouted “C'mon”. Twenty-five years later his son Cruz plays too — and when he wins a big point, he does the same “C'mon”. He is telling everyone whose footsteps he is walking in.",
        "Paul says God's promise never ran along the track of law-keeping. “If those who are of the law are heirs, faith is made empty and the promise nullified, because the law produces wrath” (vv.14–15). The law is good; it shows us when we have stepped over the line. But that is bad news for people who cross the line all the time. The law shows how bad we are, and in doing so it shows how good God is to promise righteousness by faith.",
        "Do not mistake faith for an easier alternative — as though the law was too hard, so God lowered the bar to something simpler called believing. Even our faith comes from God. We can no more manufacture trust in God than we can keep his law perfectly. And trusting God fully is far harder than relying on ourselves, because we are always tempted to keep a little credit, a little glory, for ourselves. That is not faith. Faith trusts that God has done everything, gives him all the credit, and tells people that he is the one we glory in.",
        "Abraham waited years for glimpses of what God had promised. Anyone with worldly sense would have called him a fool. He walked with conviction anyway. So do we."
      ],
      pray: "Father, I am slow to give you all the credit and quick to keep a little for myself. Strip that from me, and let me walk in the steps of father Abraham with conviction, even when I am thought a fool for it. And please provide four new accompanists for our Chinese Parallel congregation — raise them up, give them willing hearts and skilful hands, so that your people can sing your praise. Amen.",
      ask: "Where has trusting God recently made you look foolish to people who are wise by the world's measure — and did you keep walking?"
    },
    {
      t: "Hope Against Hope",
      read: "Romans 4:17b–21 (CSB)",
      body: [
        "Here is the God Abraham believed in: “the one who gives life to the dead and calls things into existence that do not exist” (v.17). If God has promised something, that thing will happen. Even when there is no hope at all from where we are standing, if it is God's will there is always hope — and that hope is sure.",
        "Which is just as well, because Abraham was facing the deadness of his own ninety-nine-year-old body and the deadness of Sarah's womb (v.19). There was no denying it. It would be like a ninety-nine-year-old man leaving his nursing home to find a bride in another nursing home, and then house-hunting near a preschool. Nobody does that, because it does not happen.",
        "“He did not waver in unbelief at God's promise but was strengthened in his faith and gave glory to God” (v.20). Everything Abraham had ever been taught about bodies and babies said no. He held on to one thing above all else: he was “fully convinced that what God had promised, he was also able to do” (v.21). That is what faith looks like — not merely knowing facts about God, but being so convinced by his promises that you hope against hope.",

/* ========================================================================== */

const DAYNAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];

const $ = id => document.getElementById(id);
let wIdx = 0, dIdx = 0;

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch (e) { /* private browsing — progress just won't persist */ }
}

function dateOf(week, i) {
  const p = week.start.split("-").map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  d.setDate(d.getDate() + i);
  return d;
}
function longDate(d) {
  return DAYNAMES[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}
function shortRange(week) {
  const a = dateOf(week, 0), b = dateOf(week, 5);
  const am = MONTHS[a.getMonth()], bm = MONTHS[b.getMonth()];
  return "Monday " + a.getDate() + (am === bm ? "" : " " + am) +
         " – Saturday " + b.getDate() + " " + bm + " " + b.getFullYear();
}
function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

/* which day index is "today", or -1 if we are outside the week */
function todayIndex(week) {
  const now = midnight(new Date());
  for (let i = 0; i < week.days.length; i++) {
    if (midnight(dateOf(week, i)) === now) return i;
  }
  return -1;
}
/* the week whose dates are nearest to today */
function nearestWeek() {
  const now = midnight(new Date());
  let best = 0, bestGap = Infinity;
  WEEKS.forEach((w, i) => {
    const gap = Math.min(
      Math.abs(midnight(dateOf(w, 0)) - now),
      Math.abs(midnight(dateOf(w, 5)) - now)
    );
    if (gap < bestGap) { bestGap = gap; best = i; }
  });
  return best;
}

function doneKey(week, i) { return "dd:" + week.id + ":" + i; }
function isDone(week, i) { return store(doneKey(week, i)) === "1"; }

function buildWeekSelect() {
  const sel = $("weekSel");
  sel.innerHTML = "";
  WEEKS.forEach((w, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = w.passage;
    sel.appendChild(o);
  });
  sel.style.display = WEEKS.length > 1 ? "" : "none";
}

function renderWeek() {
  const w = WEEKS[wIdx];
  $("weekSel").value = wIdx;
  $("wTitle").textContent = w.title;
  $("wPassage").textContent = "Daily devotions in " + w.passage;
  $("wDates").textContent = shortRange(w);
  $("wIdea").textContent = w.idea;
  $("wHow").textContent = w.how;
  document.title = w.title + " — Daily Devotions";

  const rail = $("rail");
  rail.innerHTML = "";
  const ti = todayIndex(w);
  w.days.forEach((d, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.textContent = DAYNAMES[i].slice(0, 3) + " · " + (i + 1);
    b.title = d.t;
    if (i === ti) b.classList.add("today-dot");
    b.onclick = () => {
      dIdx = i;
      if (document.body.classList.contains("showall")) {
        const t = $("days").children[i];
        if (t && t.scrollIntoView) t.scrollIntoView({ behavior: "smooth", block: "start" });
        paint();
      } else {
        renderDay();
      }
    };
    rail.appendChild(b);
  });

  const main = $("days");
  main.innerHTML = "";
  w.days.forEach((d, i) => {
    const sec = document.createElement("article");
    sec.className = "day";
    sec.dataset.i = i;
    sec.innerHTML =
      '<p class="day-no">Day ' + (i + 1) + ' &middot; ' + DAYNAMES[i] + '</p>' +
      '<h2></h2>' +
      '<p class="day-date"></p>' +
      '<span class="readref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c3-1.5 6-1.5 9 0 3-1.5 6-1.5 9 0v14c-3-1.5-6-1.5-9 0-3-1.5-6-1.5-9 0V5z"/><path d="M12 5v14"/></svg><span class="rr"></span></span>' +
      '<div class="prose"></div>' +
      '<div class="block pray"><h3>Pray</h3><p class="pp"></p></div>' +
      '<div class="block three"><h3>Every day this week</h3><p class="tt"></p></div>' +
      '<div class="block reflect"><h3>Reflect</h3><p class="rf"></p></div>' +
      '<div class="markrow"><button class="btn ghost mark" type="button"></button></div>' +
      '<div class="navrow"><button class="btn ghost prev" type="button">&larr; Previous day</button>' +
      '<button class="btn next" type="button">Next day &rarr;</button></div>';
    sec.querySelector("h2").textContent = d.t;
    sec.querySelector(".day-date").textContent = longDate(dateOf(w, i));
    sec.querySelector(".rr").textContent = "Read " + d.read;
    const pr = sec.querySelector(".prose");
    d.body.forEach(t => { const p = document.createElement("p"); p.textContent = t; pr.appendChild(p); });
    sec.querySelector(".pp").textContent = d.pray;
    sec.querySelector(".tt").textContent = w.three;
    sec.querySelector(".rf").textContent = d.ask;
    sec.querySelector(".mark").onclick = () => {
      store(doneKey(w, i), isDone(w, i) ? "0" : "1");
      paint();
    };
    sec.querySelector(".prev").onclick = () => { if (dIdx > 0) { dIdx--; renderDay(); } };
    sec.querySelector(".next").onclick = () => { if (dIdx < w.days.length - 1) { dIdx++; renderDay(); } };
    main.appendChild(sec);
  });
}

function renderDay() {
  const w = WEEKS[wIdx];
  dIdx = Math.max(0, Math.min(w.days.length - 1, dIdx));
  [].forEach.call($("days").children, (sec, i) => { sec.style.display = i === dIdx ? "" : "none"; });
  const cur = $("days").children[dIdx];
  cur.style.animation = "none"; void cur.offsetWidth; cur.style.animation = "";
  location.hash = w.id + "/" + (dIdx + 1);
  paint();
  const pill = $("rail").children[dIdx];
  if (pill && pill.scrollIntoView) pill.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function paint() {
  const w = WEEKS[wIdx];
  let done = 0;
  [].forEach.call($("rail").children, (b, i) => {
    b.setAttribute("aria-current", i === dIdx ? "true" : "false");
    b.classList.toggle("done", isDone(w, i));
    if (isDone(w, i)) done++;
  });
  [].forEach.call($("days").children, (sec, i) => {
    const btn = sec.querySelector(".mark");
    btn.textContent = isDone(w, i) ? "✓ Read — mark as unread" : "Mark this day as read";
    sec.querySelector(".prev").disabled = i === 0;
    sec.querySelector(".next").disabled = i === w.days.length - 1;
  });
  const pct = Math.round(done / w.days.length * 100);
  $("progText").textContent = done + " of " + w.days.length + " days read this week";
  $("progBar").style.width = pct + "%";
}

function goToday() {
  const near = nearestWeek();
  if (near !== wIdx) { wIdx = near; renderWeek(); }
  const ti = todayIndex(WEEKS[wIdx]);
  dIdx = ti >= 0 ? ti : 0;
  renderDay();
}

/* ---- whole week on screen ---- */
function showAll() { return document.body.classList.contains("showall"); }

function setAll(on) {
  document.body.classList.toggle("showall", on);
  $("allBtn").textContent = on ? "Back to one day at a time" : "Read the whole week";
  if (on) {
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    renderDay();
  }
}
$("allBtn").onclick = () => setAll(!showAll());

/* ---- print / save as PDF ----
   window.print() is ignored by some browsers — notably a page added to an
   iPhone home screen. So: open the whole week first (which is what people
   actually want), then try to print, and if nothing happens say what to do. */
function printWeek() {
  const wasAll = showAll();
  if (!wasAll) setAll(true);
  document.body.classList.add("printing");

  let fired = false;
  const done = () => document.body.classList.remove("printing");
  window.addEventListener("beforeprint", function onBefore() {
    fired = true;
    window.removeEventListener("beforeprint", onBefore);
  });
  window.addEventListener("afterprint", function onAfter() {
    window.removeEventListener("afterprint", onAfter);
    done();
  });

  let ok = true;
  try {
    if (typeof window.print === "function") window.print(); else ok = false;
  } catch (e) { ok = false; }

  setTimeout(() => {
    if (!fired) done();
    if (!ok || !fired) {
      const tip = $("printTip");
      tip.textContent = "If no print window appeared, all six days are now open above — " +
        "use your browser's Share or File menu and choose Print (or Save as PDF). " +
        "On an iPhone home-screen app, open this page in Safari first.";
      tip.classList.add("on");
    }
  }, 1200);
}
$("printBtn").onclick = printWeek;

/* ---- boot ---- */
buildWeekSelect();
$("weekSel").onchange = e => { wIdx = +e.target.value; dIdx = 0; setAll(false); renderWeek(); renderDay(); };
$("todayBtn").onclick = () => { setAll(false); goToday(); };

(function start() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const m = h.match(/^([^/]+)(?:\/(\d+))?$/);
  const found = m ? WEEKS.findIndex(w => w.id === m[1]) : -1;
  if (found > -1) {
    wIdx = found;
    renderWeek();
    dIdx = m[2] ? +m[2] - 1 : 0;
    renderDay();
  } else {
    wIdx = nearestWeek();
    renderWeek();
    goToday();
  }
})();

document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); dIdx++; renderDay(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); dIdx--; renderDay(); }
});

/* swipe between days on a phone */
(function swipe() {
  let x0 = null, y0 = null;
  document.addEventListener("touchstart", e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) {
      dIdx += dx < 0 ? 1 : -1;
      renderDay();
    }
    x0 = y0 = null;
  }, { passive: true });
})();
</script>
