<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>查经材料 — 高嘉华圣保罗圣公会</title>
<link rel="apple-touch-icon" sizes="180x180" href="hub-apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="hub-favicon-32.png">
<meta name="theme-color" content="#0e1a2b">
<meta name="description" content="高嘉华圣保罗圣公会的成长小组查经材料 — 青少年、成人、青年成人及安老院短讲。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--night:#0e1a2b;--night-soft:#142339;--night-card:#1a2c47;--brass:#d4a253;
        --brass-soft:#b08539;--cream:#f5ead4;--cream-dim:#c9bfa8;
        --line:rgba(212,162,83,0.18);--line-strong:rgba(212,162,83,0.42)}
  html{font-size:18px;-webkit-text-size-adjust:100%}
  body{font-family:'Inter Tight','PingFang SC','Songti SC','Microsoft YaHei',system-ui,sans-serif;
       background:var(--night);color:var(--cream);line-height:1.8;min-height:100vh;
       display:flex;flex-direction:column}
  .shell{width:min(720px,100%);margin:0 auto;padding:0 1.35rem;flex:1}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;
          padding:1.4rem 0 0.4rem;font-size:0.84rem}
  .topbar a{color:var(--brass);text-decoration:none}
  .topbar a:hover{text-decoration:underline}
  header{padding:1.6rem 0 1.4rem}
  .eyebrow{font-size:0.76rem;letter-spacing:0.2em;color:var(--brass);margin-bottom:0.9rem}
  h1{font-family:'Fraunces',Georgia,'Songti SC',serif;font-weight:600;
     font-size:clamp(2rem,7vw,2.8rem);line-height:1.2}
  .tagline{margin-top:0.8rem;color:var(--cream-dim);font-size:1rem;max-width:520px}
  .controls{position:sticky;top:0;z-index:5;background:var(--night);
            padding:0.9rem 0 0.8rem;border-bottom:1px solid var(--line)}
  input[type=search]{width:100%;background:var(--night-soft);border:1px solid var(--line);
       border-radius:12px;padding:0.7rem 0.95rem;color:var(--cream);font:inherit;font-size:0.95rem}
  input[type=search]::placeholder{color:var(--cream-dim);opacity:0.75}
  input[type=search]:focus{outline:none;border-color:var(--line-strong)}
  .chips{display:flex;flex-wrap:wrap;gap:0.45rem;margin-top:0.7rem}
  .chip{background:transparent;border:1px solid var(--line);color:var(--cream-dim);
        border-radius:999px;padding:0.34rem 0.85rem;font:inherit;font-size:0.82rem;cursor:pointer}
  .chip[aria-pressed="true"]{background:rgba(212,162,83,0.14);border-color:var(--line-strong);
        color:var(--brass)}
  .count{margin:1.1rem 0 0.2rem;font-size:0.8rem;letter-spacing:0.12em;color:var(--cream-dim)}
  .list{display:grid;gap:0.85rem;padding:0.9rem 0 1rem}
  a.study{display:block;text-decoration:none;color:inherit;background:var(--night-soft);
        border:1px solid var(--line);border-radius:16px;padding:1.05rem 1.15rem}
  a.study:hover{border-color:var(--line-strong);background:var(--night-card)}
  .tag{display:inline-block;font-size:0.72rem;color:var(--brass);border:1px solid var(--line);
       border-radius:999px;padding:0.12rem 0.6rem;margin-bottom:0.55rem}
  a.study h2{font-family:'Fraunces',Georgia,'Songti SC',serif;font-weight:600;font-size:1.18rem;line-height:1.45}
  a.study .meta{margin-top:0.3rem;color:var(--brass-soft);font-size:0.86rem}
  a.study .idea{margin-top:0.5rem;color:var(--cream-dim);font-size:0.9rem}
  .notice{background:rgba(20,35,57,0.7);border:1px solid var(--line);border-left:3px solid var(--brass);
          border-radius:12px;padding:1.1rem 1.25rem;margin:1.6rem 0;color:var(--cream-dim);font-size:0.94rem}
  .notice a{color:var(--brass)}
  footer{border-top:1px solid var(--line);text-align:center;color:var(--cream-dim);
         font-size:0.86rem;line-height:1.9;padding:2.2rem 1.35rem 2.6rem;margin-top:1.4rem}
  footer a{color:var(--brass);text-decoration:none}
  footer .sdg{display:block;margin-top:0.8rem;font-family:'Fraunces',Georgia,serif;
              font-style:italic;color:var(--brass-soft)}
  @media (max-width:420px){html{font-size:17px}}
</style>
</head>
<body>
<div class="shell">
  <nav class="topbar">
    <a href="index.html">← 主页</a>
    <a href="bible-studies.html">English</a>
  </nav>

  <header>
    <p class="eyebrow">高嘉华圣保罗圣公会</p>
    <h1>查经材料</h1>
    <p class="tagline">跟随主日讲道的成长小组查经 — 青少年、成人、青年成人，以及安老院短讲。</p>
  </header>

  <div class="controls">
    <input type="search" id="q" placeholder="搜索题目、经文或中心信息…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>

  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
  <div class="notice" id="notice" hidden>
    中文版查经材料正在预备中。目前请先使用
    <a href="bible-studies.html">英文版</a>，或参阅
    <a href="daily-devotions-cn.html">每日灵修（中文）</a>。
  </div>
</div>

<footer>
  翁沛偉牧师 Rev David Yung &middot; 高嘉华圣保罗圣公会<br>
  <a href="mailto:dyung@kogarah.church">dyung@kogarah.church</a> &middot; (02) 9587 5951<br>
  <a href="daily-devotions-cn.html">每日灵修</a> &middot;
  <a href="seven-stars-cn.html">七星指向耶稣</a>
  <span class="sdg">Soli Deo Gloria</span>
</footer>

<script>
/* ------------------------------------------------------------------
   与英文版 bible-studies.html 相同的字段结构，由 add-study.py 写入。
     n 编号 / c 系列代码 ky|gg|ya|nh / t 题目 / r 经文 /
     d 主日日期 / note 年月 / idea 中心信息 / u 页面档名
------------------------------------------------------------------ */
/* STUDIES:START */
const STUDIES = [
];
/* STUDIES:END */

const GROUPS = [
  { c: "all", label: "全部" },
  { c: "ky",  label: "青少年" },
  { c: "gg",  label: "成人小组" },
  { c: "ya",  label: "青年成人" },
  { c: "nh",  label: "安老院" }
];
const NAMES = { ky: "青少年成长小组", gg: "成人成长小组", ya: "青年成人", nh: "安老院短讲" };

let active = "all";

const chipsEl  = document.getElementById("chips");
const listEl   = document.getElementById("list");
const countEl  = document.getElementById("count");
const qEl      = document.getElementById("q");
const noticeEl = document.getElementById("notice");

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
  });
}

GROUPS.forEach(function (g) {
  const b = document.createElement("button");
  b.className = "chip";
  b.type = "button";
  b.textContent = g.label;
  b.setAttribute("aria-pressed", g.c === active ? "true" : "false");
  b.addEventListener("click", function () {
    active = g.c;
    Array.prototype.forEach.call(chipsEl.children, function (n) {
      n.setAttribute("aria-pressed", n === b ? "true" : "false");
    });
    render();
  });
  chipsEl.appendChild(b);
});

function render() {
  const term = qEl.value.trim().toLowerCase();
  const rows = STUDIES.filter(function (s) {
    if (active !== "all" && s.c !== active) return false;
    if (!term) return true;
    return (s.t + " " + s.r + " " + (s.idea || "") + " " + (s.note || ""))
      .toLowerCase().indexOf(term) !== -1;
  });

  countEl.textContent = "共 " + rows.length + " 篇";
  noticeEl.hidden = STUDIES.length > 0;

  listEl.innerHTML = rows.map(function (s) {
    return '<a class="study" href="' + esc(s.u) + '">' +
             '<span class="tag">' + esc(NAMES[s.c] || s.c) + '</span>' +
             '<h2>' + esc(s.t) + '</h2>' +
             '<p class="meta">' + esc(s.r) + ' &middot; ' + esc(s.note) + '</p>' +
             (s.idea ? '<p class="idea">' + esc(s.idea) + '</p>' : '') +
           '</a>';
  }).join("");
}

qEl.addEventListener("input", render);
render();
</script>
</body>
</html>
