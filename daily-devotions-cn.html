<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --night: #0e1a2b; --night-soft: #142339; --night-card: #1a2c47;
    --brass: #d4a253; --brass-soft: #b08539; --cream: #f5ead4; --cream-dim: #c9bfa8;
    --sage: #88a899; --rose: #d97a6c;
    --line: rgba(212,162,83,0.18); --line-strong: rgba(212,162,83,0.42);
    --shell: min(760px, 100%);
  }
  html { font-size: 18px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: 'Inter Tight', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    background: var(--night); color: var(--cream);
    min-height: 100vh; line-height: 1.65; overflow-x: hidden; position: relative;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(245,234,212,0.45), transparent),
      radial-gradient(1px 1px at 78% 9%, rgba(245,234,212,0.35), transparent),
      radial-gradient(1.5px 1.5px at 42% 32%, rgba(212,162,83,0.5), transparent),
      radial-gradient(1px 1px at 89% 64%, rgba(245,234,212,0.4), transparent),
      radial-gradient(1px 1px at 23% 73%, rgba(245,234,212,0.35), transparent),
      radial-gradient(1.5px 1.5px at 60% 88%, rgba(212,162,83,0.45), transparent),
      radial-gradient(1px 1px at 33% 51%, rgba(245,234,212,0.28), transparent),
      radial-gradient(1px 1px at 95% 36%, rgba(245,234,212,0.35), transparent);
  }
  body::after {
    content: ''; position: fixed; top: -220px; left: 50%; transform: translateX(-50%);
    width: 820px; height: 520px; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(212,162,83,0.13), transparent 65%);
  }
  .shell { position: relative; z-index: 1; width: var(--shell); margin: 0 auto; padding: 0 1.25rem; }

  /* ---- top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(14,26,43,0.86); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-in {
    width: var(--shell); margin: 0 auto; padding: 0.7rem 1.25rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .brandmark { display: flex; align-items: center; gap: 0.55rem; margin-right: auto; min-width: 0; }
  .brandmark svg { width: 26px; height: 26px; flex: none; }
  .brandmark b {
    font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-weight: 600; font-size: 0.98rem;
    letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  select.week {
    font: inherit; font-size: 0.82rem; color: var(--cream);
    background: var(--night-card); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 0.35rem 0.7rem; max-width: 42vw;
  }
  .btn {
    font: inherit; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.04em;
    color: var(--night); background: var(--brass); border: 0;
    border-radius: 999px; padding: 0.4rem 0.95rem; cursor: pointer; white-space: nowrap;
    transition: background 0.18s, transform 0.18s;
  }
  .btn:hover { background: #e5b76b; }
  .btn:active { transform: scale(0.96); }
  .btn.ghost { background: transparent; color: var(--brass); border: 1px solid var(--line-strong); }
  .btn.ghost:hover { background: rgba(212,162,83,0.1); }
  .btn[disabled] { opacity: 0.3; pointer-events: none; }
  a.xlink {
    display: inline-flex; align-items: center; gap: 0.35rem; flex: none;
    text-decoration: none; color: var(--brass); font-size: 0.8rem; letter-spacing: 0.04em;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 0.4rem 0.8rem; transition: background 0.18s;
  }
  a.xlink:hover { background: rgba(212,162,83,0.12); }
  a.xlink span { display: none; }
  @media (min-width: 560px) { a.xlink span { display: inline; } }

  /* ---- hero ---- */
  header.hero { padding: 2.6rem 0 1.8rem; text-align: center; }
  .eyebrow {
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 1rem;
    display: flex; align-items: center; justify-content: center; gap: 0.8rem;
  }
  .eyebrow::before, .eyebrow::after { content: ''; height: 1px; width: 32px; background: var(--brass-soft); opacity: 0.6; }
  header.hero h1 {
    font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-weight: 600;
    font-size: clamp(2rem, 7vw, 3rem); line-height: 1.12; letter-spacing: -0.01em;
  }
  .hero-sub { margin-top: 0.55rem; color: var(--brass); font-size: 1.02rem; letter-spacing: 0.02em; }
  .hero-dates { margin-top: 0.2rem; color: var(--cream-dim); font-size: 0.88rem; }
  .bigidea {
    margin: 1.6rem auto 0; max-width: 620px; text-align: left;
    background: var(--night-soft); border: 1px solid var(--line);
    border-radius: 14px; padding: 1.05rem 1.2rem;
    font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-size: 1.02rem; line-height: 1.55;
  }
  .bigidea b { color: var(--brass); font-weight: 600; }
  details.howto { margin: 0.85rem auto 0; max-width: 620px; text-align: left; }
  details.howto summary {
    cursor: pointer; list-style: none; color: var(--brass);
    font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase;
  }
  details.howto summary::-webkit-details-marker { display: none; }
  details.howto summary::after { content: ' ▾'; }
  details.howto[open] summary::after { content: ' ▴'; }
  details.howto p { margin-top: 0.6rem; color: var(--cream-dim); font-size: 0.94rem; }

  /* ---- day rail ---- */
  .rail-wrap {
    position: sticky; top: calc(env(safe-area-inset-top) + 3.05rem); z-index: 15;
    background: rgba(14,26,43,0.9); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line); margin-top: 1.4rem;
  }
  .rail {
    width: var(--shell); margin: 0 auto; padding: 0.6rem 1.25rem;
    display: flex; gap: 0.45rem; overflow-x: auto; scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail button {
    font: inherit; font-size: 0.8rem; flex: none; cursor: pointer;
    background: var(--night-card); color: var(--cream-dim);
    border: 1px solid transparent; border-radius: 999px;
    padding: 0.42rem 0.9rem; transition: 0.18s; position: relative;
  }
  .rail button:hover { color: var(--cream); border-color: var(--line); }
  .rail button[aria-current="true"] {
    background: var(--brass); color: var(--night); font-weight: 600; border-color: var(--brass);
  }
  .rail button.done::after {
    content: '✓'; position: absolute; top: -3px; right: -1px;
    font-size: 0.62rem; width: 14px; height: 14px; line-height: 14px;
    border-radius: 50%; background: var(--sage); color: var(--night); font-weight: 700;
  }
  .rail button.today-dot { box-shadow: inset 0 0 0 1px var(--line-strong); }

  /* ---- day panel ---- */
  main { padding: 2rem 0 3rem; }
  .day { animation: rise 0.35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .day-no { font-size: 0.74rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--brass); }
  .day h2 {
    font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-weight: 600;
    font-size: clamp(1.7rem, 5.6vw, 2.3rem); line-height: 1.18; margin-top: 0.35rem;
  }
  .day-date { color: var(--cream-dim); font-size: 0.88rem; margin-top: 0.3rem; }
  .readref {
    display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1.1rem;
    background: rgba(212,162,83,0.1); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 0.42rem 1rem;
    color: var(--brass); font-size: 0.94rem; font-weight: 500;
  }
  .readref svg { width: 15px; height: 15px; flex: none; }
  .prose { margin-top: 1.3rem; }
  .prose p { margin-bottom: 1rem; font-size: 1.04rem; }
  .prose p:last-child { margin-bottom: 0; }

  .block { margin-top: 1.6rem; border-radius: 14px; padding: 1.1rem 1.25rem; }
  .block h3 {
    font-family: 'Inter Tight', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.24em; text-transform: uppercase; margin-bottom: 0.6rem;
  }
  .pray { background: var(--night-soft); border: 1px solid var(--line); border-left: 3px solid var(--brass); }
  .pray h3 { color: var(--brass); }
  .pray p { font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-style: italic; font-size: 1.03rem; line-height: 1.6; }
  .three { background: rgba(136,168,153,0.09); border: 1px solid rgba(136,168,153,0.28); border-left: 3px solid var(--sage); }
  .three h3 { color: var(--sage); }
  .three p { color: var(--cream-dim); font-size: 0.97rem; }
  .reflect { background: var(--night-card); border: 1px solid var(--line); }
  .reflect h3 { color: var(--rose); }
  .reflect p { font-size: 1.03rem; }

  .markrow { margin-top: 1.7rem; display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  .navrow { margin-top: 1.2rem; display: flex; gap: 0.6rem; }
  .navrow .btn { flex: 1; text-align: center; padding: 0.6rem 1rem; font-size: 0.9rem; }

  /* ---- whole-week view ---- */
  body.showall .day { display: block !important; }
  body.showall .day + .day { margin-top: 3rem; padding-top: 2.4rem; border-top: 1px solid var(--line); }
  body.showall .navrow { display: none; }
  body.printing .day { display: block !important; }

  .tools { margin-top: 1.8rem; display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
  .tools .btn { font-size: 0.84rem; padding: 0.5rem 1.1rem; }
  .tip {
    margin: 0.75rem auto 0; max-width: 460px; text-align: center;
    color: var(--cream-dim); font-size: 0.8rem; line-height: 1.5; display: none;
  }
  .tip.on { display: block; }

  .prog { margin-top: 2.4rem; text-align: center; color: var(--cream-dim); font-size: 0.82rem; }
  .prog .bar { height: 4px; border-radius: 999px; background: var(--night-card); margin: 0.55rem auto 0; max-width: 260px; overflow: hidden; }
  .prog .bar i { display: block; height: 100%; background: var(--brass); transition: width 0.4s; }

  footer {
    position: relative; z-index: 1; margin-top: 2.5rem; padding: 2rem 1.25rem 2.6rem;
    border-top: 1px solid var(--line); text-align: center;
    color: var(--cream-dim); font-size: 0.86rem; line-height: 1.85;
  }
  footer a { color: var(--brass); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .sdg { display: block; margin-top: 0.9rem; font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-style: italic; color: var(--brass-soft); }

  @media (max-width: 420px) {
    html { font-size: 17px; }
    .brandmark b { font-size: 0.9rem; }
  }

  /* ---- print: the whole week ---- */
  @media print {
    body { background: #fff; color: #111; }
    body::before, body::after, .topbar, .rail-wrap, .markrow, .navrow, .prog, .tools, .tip, .btn, footer { display: none !important; }
    .shell { width: 100%; padding: 0; }
    .day { display: block !important; page-break-after: always; animation: none; }
    .day h2, header.hero h1 { color: #3a2a10; }
    .block, .bigidea { border: 1px solid #bbb !important; background: #fafafa !important; }
    .day-no, .readref, .pray h3 { color: #7a5a18 !important; }
    .readref { border-color: #bbb; }
    .three h3 { color: #3f5a4c !important; }
    .reflect h3 { color: #8a3f33 !important; }
  }
</style>
</head>

<script>
/* ==========================================================================
   DEVOTION DATA
   --------------------------------------------------------------------------
   To add a new week, copy one WEEKS entry and edit it. Nothing else changes.

     id      unique slug, used in the #hash link and to save progress
     title   the series title (usually the sermon title)
     passage the passage the week works through
     start   Monday of that week, "YYYY-MM-DD" — the app uses it to find today
     idea    the sermon's big idea, one sentence
     how     the "how to use" note
     days[]  one entry per day, in order:
               t     day title
               read  Bible reading reference (reference only)
               body  array of paragraphs
               pray  the written prayer, including that day's Checkpoint
               ask   the reflection question
     three   the standing reminder printed under every prayer that week
   ========================================================================== */

const WEEKS = [
{
  id: "romans4",
  title: "无可指望时仍有指望",
  passage: "罗马书4:1–25",
  start: "2026-08-10",
  idea: "要满心相信、欢欢喜喜地信靠神——在无可指望的时候仍因信有指望；他把义算给一切信靠他、信他叫我们主耶稣从死里复活的人。",
  how: "每天找一个安静的十分钟。先慢慢读当天的短短经文（建议用《和合本》），再读灵修反思——它跟随主日讲道走过这段经文。用自己的话祷读所附的祷文，然后带着那个问题去过你一天的生活。星期一至星期六共六天，好叫主日的话语一直作工，直到下一个主日。每天的祷文都带着我们教会六个检查点之一——到了星期六，你就为全部六个都祷告过了。",
  three: "一如本周每一天：为你三位还未信主的朋友祷告——愿神的恩慈领他们悔改，也愿神赐你机会，把他们中间的一位指向耶稣。",
  days: [
    {
      t: "这义算给谁？",
      read: "罗马书4:1–5（和合本）",
      body: [
        "从前电视节目会把演职员名单放在开头——演员、导演、监制、化妆师、助理——因为一出戏是许多人辛苦作成的。后来名单挪到片尾，再后来被快转，如今片尾还没开始，你已经按下了下一集。谁还在意那份名单呢？",
        "在罗马书第四章，有一个人被记上一笔；但比这个人更叫人惊奇的，是那位记账的——是神自己。而他所记的人，是亚伯拉罕。",
        "保罗问亚伯拉罕“得了什么”。这是一个很美的字：亚伯拉罕发现了一件事。他发现自己在神面前无可夸口。在人面前其实也是。七十五岁以前，他大半生是拜偶像的人；他不止一次为保命而说谎，甚至让妻子陷入危险。有些犹太教师把他高举为律法未颁布以先就守全律法的人，亚伯拉罕自己却清楚得很。",
        "圣经反倒说：“亚伯拉罕信神，这就算为他的义。”（3节）第4节把界线划清了：工价是欠的，恩典是白给的。没有人会为薪水写卡片谢老板；也没有客人在你生日之后寄账单来收礼物钱——若真有，他从来就不是你的朋友。工价不是礼物，礼物也不是工价。",
        "所以，不要再问“我为神成就了什么”，要开始问“神在基督里把什么算给了我”。"
      ],
      pray: "天父，我一直暗暗记着自己的好行为，指望它在你面前算数。求你赦免我。求你教我把你的义当作礼物领受——那是在耶稣里白白赐下的，从来不是我挣来的。我们求你兴起三个周间成长小组：兴起带领的人，打开接待的家，聚集你的百姓，叫我们更多人一同学习凭信心而活。奉主耶稣的名求，阿们。",
      ask: "你在哪一方面仍想把账单递给神——把自己某部分的顺服，当作神欠你的？"
    },
    {
      t: "那份罪证不见了",
      read: "罗马书4:6–8（和合本）",
      body: [
        "保罗传召第二位证人，而这人绝不是你会挑来作品格证明的：大卫王——奸淫的人、说谎的人，也是设计害死忠良的人。大卫却唱说：“得赦免其过、遮盖其罪的，这人是有福的！主不算为有罪的，这人是有福的！”（7–8节，引自诗篇32篇）",
        "有福，就是有喜乐——因为神喜悦你。你的罪被遮盖了，神必不再翻旧账。",

/* ========================================================================== */

const DAYNAMES = ["星期一","星期二","星期三","星期四","星期五","星期六"];
const MONTHS = null; /* Chinese dates are numeric */

const $ = id => document.getElementById(id);
let wIdx = 0, dIdx = 0;

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch (e) { /* private browsing — progress just won't persist */ }
}

function dateOf(week, i) {
  const p = week.start.split("-").map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  d.setDate(d.getDate() + i);
  return d;
}
function longDate(d) {
  return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日（" +
         DAYNAMES[(d.getDay() + 6) % 7] + "）";
}
function shortRange(week) {
  const a = dateOf(week, 0), b = dateOf(week, 5);
  return a.getFullYear() + "年" + (a.getMonth() + 1) + "月" + a.getDate() + "日（星期一）至" +
         (a.getMonth() === b.getMonth() ? "" : (b.getMonth() + 1) + "月") +
         b.getDate() + "日（星期六）";
}
function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

/* which day index is "today", or -1 if we are outside the week */
function todayIndex(week) {
  const now = midnight(new Date());
  for (let i = 0; i < week.days.length; i++) {
    if (midnight(dateOf(week, i)) === now) return i;
  }
  return -1;
}
/* the week whose dates are nearest to today */
function nearestWeek() {
  const now = midnight(new Date());
  let best = 0, bestGap = Infinity;
  WEEKS.forEach((w, i) => {
    const gap = Math.min(
      Math.abs(midnight(dateOf(w, 0)) - now),
      Math.abs(midnight(dateOf(w, 5)) - now)
    );
    if (gap < bestGap) { bestGap = gap; best = i; }
  });
  return best;
}

function doneKey(week, i) { return "dd:" + week.id + ":" + i; }
function isDone(week, i) { return store(doneKey(week, i)) === "1"; }

function buildWeekSelect() {
  const sel = $("weekSel");
  sel.innerHTML = "";
  WEEKS.forEach((w, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = w.passage;
    sel.appendChild(o);
  });
  sel.style.display = WEEKS.length > 1 ? "" : "none";
}

function renderWeek() {
  const w = WEEKS[wIdx];
  $("weekSel").value = wIdx;
  $("wTitle").textContent = w.title;
  $("wPassage").textContent = w.passage + " 六天每日灵修";
  $("wDates").textContent = shortRange(w);
  $("wIdea").textContent = w.idea;
  $("wHow").textContent = w.how;
  document.title = w.title + " — 每日灵修";

  const rail = $("rail");
  rail.innerHTML = "";
  const ti = todayIndex(w);
  w.days.forEach((d, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.textContent = DAYNAMES[i].slice(-1) + " · " + (i + 1);
    b.title = d.t;
    if (i === ti) b.classList.add("today-dot");
    b.onclick = () => {
      dIdx = i;
      if (document.body.classList.contains("showall")) {
        const t = $("days").children[i];
        if (t && t.scrollIntoView) t.scrollIntoView({ behavior: "smooth", block: "start" });
        paint();
      } else {
        renderDay();
      }
    };
    rail.appendChild(b);
  });

  const main = $("days");
  main.innerHTML = "";
  w.days.forEach((d, i) => {
    const sec = document.createElement("article");
    sec.className = "day";
    sec.dataset.i = i;
    sec.innerHTML =
      '<p class="day-no">第 ' + (i + 1) + ' 天 &middot; ' + DAYNAMES[i] + '</p>' +
      '<h2></h2>' +
      '<p class="day-date"></p>' +
      '<span class="readref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c3-1.5 6-1.5 9 0 3-1.5 6-1.5 9 0v14c-3-1.5-6-1.5-9 0-3-1.5-6-1.5-9 0V5z"/><path d="M12 5v14"/></svg><span class="rr"></span></span>' +
      '<div class="prose"></div>' +
      '<div class="block pray"><h3>祷告</h3><p class="pp"></p></div>' +
      '<div class="block three"><h3>本周每一天</h3><p class="tt"></p></div>' +
      '<div class="block reflect"><h3>反思</h3><p class="rf"></p></div>' +
      '<div class="markrow"><button class="btn ghost mark" type="button"></button></div>' +
      '<div class="navrow"><button class="btn ghost prev" type="button">&larr; 前一天</button>' +
      '<button class="btn next" type="button">后一天 &rarr;</button></div>';
    sec.querySelector("h2").textContent = d.t;
    sec.querySelector(".day-date").textContent = longDate(dateOf(w, i));
    sec.querySelector(".rr").textContent = "读经：" + d.read;
    const pr = sec.querySelector(".prose");
    d.body.forEach(t => { const p = document.createElement("p"); p.textContent = t; pr.appendChild(p); });
    sec.querySelector(".pp").textContent = d.pray;
    sec.querySelector(".tt").textContent = w.three;
    sec.querySelector(".rf").textContent = d.ask;
    sec.querySelector(".mark").onclick = () => {
      store(doneKey(w, i), isDone(w, i) ? "0" : "1");
      paint();
    };
    sec.querySelector(".prev").onclick = () => { if (dIdx > 0) { dIdx--; renderDay(); } };
    sec.querySelector(".next").onclick = () => { if (dIdx < w.days.length - 1) { dIdx++; renderDay(); } };
    main.appendChild(sec);
  });
}

function renderDay() {
  const w = WEEKS[wIdx];
  dIdx = Math.max(0, Math.min(w.days.length - 1, dIdx));
  [].forEach.call($("days").children, (sec, i) => { sec.style.display = i === dIdx ? "" : "none"; });
  const cur = $("days").children[dIdx];
  cur.style.animation = "none"; void cur.offsetWidth; cur.style.animation = "";
  location.hash = w.id + "/" + (dIdx + 1);
  paint();
  const pill = $("rail").children[dIdx];
  if (pill && pill.scrollIntoView) pill.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function paint() {
  const w = WEEKS[wIdx];
  let done = 0;
  [].forEach.call($("rail").children, (b, i) => {
    b.setAttribute("aria-current", i === dIdx ? "true" : "false");
    b.classList.toggle("done", isDone(w, i));
    if (isDone(w, i)) done++;
  });
  [].forEach.call($("days").children, (sec, i) => {
    const btn = sec.querySelector(".mark");
    btn.textContent = isDone(w, i) ? "✓ 已读 — 标为未读" : "标记今天已读";
    sec.querySelector(".prev").disabled = i === 0;
    sec.querySelector(".next").disabled = i === w.days.length - 1;
  });
  const pct = Math.round(done / w.days.length * 100);
  $("progText").textContent = "本周已读 " + done + " / " + w.days.length + " 天";
  $("progBar").style.width = pct + "%";
}

function goToday() {
  const near = nearestWeek();
  if (near !== wIdx) { wIdx = near; renderWeek(); }
  const ti = todayIndex(WEEKS[wIdx]);
  dIdx = ti >= 0 ? ti : 0;
  renderDay();
}

/* ---- whole week on screen ---- */
function showAll() { return document.body.classList.contains("showall"); }

function setAll(on) {
  document.body.classList.toggle("showall", on);
  $("allBtn").textContent = on ? "回到逐日阅读" : "阅读整周";
  if (on) {
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    renderDay();
  }
}
$("allBtn").onclick = () => setAll(!showAll());

/* ---- print / save as PDF ----
   window.print() is ignored by some browsers — notably a page added to an
   iPhone home screen. So: open the whole week first (which is what people
   actually want), then try to print, and if nothing happens say what to do. */
function printWeek() {
  const wasAll = showAll();
  if (!wasAll) setAll(true);
  document.body.classList.add("printing");

  let fired = false;
  const done = () => document.body.classList.remove("printing");
  window.addEventListener("beforeprint", function onBefore() {
    fired = true;
    window.removeEventListener("beforeprint", onBefore);
  });
  window.addEventListener("afterprint", function onAfter() {
    window.removeEventListener("afterprint", onAfter);
    done();
  });

  let ok = true;
  try {
    if (typeof window.print === "function") window.print(); else ok = false;
  } catch (e) { ok = false; }

  setTimeout(() => {
    if (!fired) done();
    if (!ok || !fired) {
      const tip = $("printTip");
      tip.textContent = "若没有出现打印视窗，六天的内容现已全部展开在上方——" +
        "请用浏览器的「分享」或「文件」选单选择「打印」（或「存为 PDF」）。" +
        "若是从 iPhone 主画面开启的应用，请先在 Safari 中打开本页。";
      tip.classList.add("on");
    }
  }, 1200);
}
$("printBtn").onclick = printWeek;

/* ---- boot ---- */
buildWeekSelect();
$("weekSel").onchange = e => { wIdx = +e.target.value; dIdx = 0; setAll(false); renderWeek(); renderDay(); };
$("todayBtn").onclick = () => { setAll(false); goToday(); };

(function start() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const m = h.match(/^([^/]+)(?:\/(\d+))?$/);
  const found = m ? WEEKS.findIndex(w => w.id === m[1]) : -1;
  if (found > -1) {
    wIdx = found;
    renderWeek();
    dIdx = m[2] ? +m[2] - 1 : 0;
    renderDay();
  } else {
    wIdx = nearestWeek();
    renderWeek();
    goToday();
  }
})();

document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); dIdx++; renderDay(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); dIdx--; renderDay(); }
});

/* swipe between days on a phone */
(function swipe() {
  let x0 = null, y0 = null;
  document.addEventListener("touchstart", e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) {
      dIdx += dx < 0 ? 1 : -1;
      renderDay();
    }
    x0 = y0 = null;
  }, { passive: true });
})();
</script>
</body>
</html>
