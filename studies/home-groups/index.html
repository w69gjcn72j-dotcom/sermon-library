/* STUDIES:END */

const GROUPS = [
  { c: "all", label: "All" },
  { c: "ky",  label: "KOGYouth" },
  { c: "gg",  label: "Home Groups" },
  { c: "ya",  label: "Young Adults" },
  { c: "nh",  label: "Nursing Home" }
];
const NAMES = { ky: "KOGYouth", gg: "Home Groups", ya: "Young Adults", nh: "Nursing Home" };

const VALID = ["all", "ky", "gg", "ya", "nh"];
// ?c=ky preselects a collection — used by the retired study repos when they redirect here.
const wanted = new URLSearchParams(location.search).get("c");
let active = VALID.indexOf(wanted) !== -1 ? wanted : "gg";

const chipsEl = document.getElementById("chips");
const listEl  = document.getElementById("list");
const countEl = document.getElementById("count");
const qEl     = document.getElementById("q");

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
  });
}

GROUPS.forEach(function (g) {
  const b = document.createElement("button");
  b.className = "chip";
  b.type = "button";
  b.textContent = g.label;
  b.setAttribute("aria-pressed", g.c === active ? "true" : "false");
  b.addEventListener("click", function () {
    active = g.c;
    Array.prototype.forEach.call(chipsEl.children, function (n) {
      n.setAttribute("aria-pressed", n === b ? "true" : "false");
    });
    render();
  });
  chipsEl.appendChild(b);
});

function render() {
  const term = qEl.value.trim().toLowerCase();
  const rows = STUDIES.filter(function (s) {
    if (active !== "all" && s.c !== active) return false;
    if (!term) return true;
    return (s.t + " " + s.r + " " + (s.idea || "") + " " + (s.note || ""))
      .toLowerCase().indexOf(term) !== -1;
  });

  countEl.textContent = rows.length + (rows.length === 1 ? " study" : " studies");

  if (!rows.length) {
    listEl.innerHTML = '<p class="empty">Nothing here yet — try another search or collection.</p>';
    return;
  }

  listEl.innerHTML = rows.map(function (s) {
    return '<a class="study" href="' + esc(s.u) + '">' +
             '<span class="tag">' + esc(NAMES[s.c] || s.c) + '</span>' +
             '<h2>' + esc(s.t) + '</h2>' +
             '<p class="meta">' + esc(s.r) + ' &middot; ' + esc(s.note) + '</p>' +
             (s.idea ? '<p class="idea">' + esc(s.idea) + '</p>' : '') +
           '</a>';
  }).join("");
}

qEl.addEventListener("input", render);
render();
</script>
