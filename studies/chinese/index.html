function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
  });
}

GROUPS.forEach(function (g) {
  const b = document.createElement("button");
  b.className = "chip";
  b.type = "button";
  b.textContent = g.label;
  b.setAttribute("aria-pressed", g.c === active ? "true" : "false");
  b.addEventListener("click", function () {
    active = g.c;
    Array.prototype.forEach.call(chipsEl.children, function (n) {
      n.setAttribute("aria-pressed", n === b ? "true" : "false");
    });
    render();
  });
  chipsEl.appendChild(b);
});

function render() {
  const term = qEl.value.trim().toLowerCase();
  const rows = STUDIES.filter(function (s) {
    if (active !== "all" && s.c !== active) return false;
    if (!term) return true;
    return (s.t + " " + s.r + " " + (s.idea || "") + " " + (s.note || ""))
      .toLowerCase().indexOf(term) !== -1;
  });

  countEl.textContent = "共 " + rows.length + " 篇";
  noticeEl.hidden = STUDIES.length > 0;

  listEl.innerHTML = rows.map(function (s) {
    return '<a class="study" href="' + esc(s.u) + '">' +
             '<span class="tag">' + esc(NAMES[s.c] || s.c) + '</span>' +
             '<h2>' + esc(s.t) + '</h2>' +
             '<p class="meta">' + esc(s.r) + ' &middot; ' + esc(s.note) + '</p>' +
             (s.idea ? '<p class="idea">' + esc(s.idea) + '</p>' : '') +
           '</a>';
  }).join("");
}

qEl.addEventListener("input", render);
render();
</script>
</body>
</html>
